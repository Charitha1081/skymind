# Runs on every push and pull request: all test suites (offline, no API keys, no paid calls),
# then the search evaluation with a recall floor. Raise the floor as search improves (TODO.md, item 3).
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test suites
        run: python tests/run_all.py
      - name: Search recall floor
        run: python evaluate_search.py --min-recall 0.85
      - name: Routing check
        run: python evaluate.py routing
      - name: Guard check (common attacks, offline)
        run: python guard_check.py
