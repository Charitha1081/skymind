# SkyMind evaluation set.
# Each question is graded automatically:
#   must:    every item must appear in the answer (case-insensitive). "a|b" means a OR b.
#            Commas inside numbers are ignored, so 43,567 matches 43567.
#   refuse:  the answer is NOT in the documents; a correct answer says so instead of inventing one.
#   section: the document section that holds the answer (used to grade search). A refuse question
#            may also name the section that tells the bot not to answer (e.g. tuition amounts).
#   level:   easy or hard (used to grade routing: hard questions should go to the strong model).
# Add your own questions the same way; more questions = more trustworthy numbers.

