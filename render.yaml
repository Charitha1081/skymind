# Render Blueprint: one click creates the SkyMind website and its Redis.
# Render dashboard -> New -> Blueprint -> pick this GitHub repo -> Apply.
services:
  - type: web
    name: skymind
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: skymind-redis
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true          # find it under Environment in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false                  # optional: free Gemini key from Google AI Studio
      - key: ANTHROPIC_API_KEY
        sync: false                  # add your Claude API key in the dashboard for real answers; without it SkyMind runs free in mock mode
      - key: SEED_EXAMPLES
        value: "true"                # free Redis is wiped on restart; re-create UNT Helper and Acme Support
      - key: FORWARDED_ALLOW_IPS
        value: "*"                   # trust Render's proxy so rate limits see each visitor's address
      - key: CHAT_LIMIT_PER_IP
        value: "30"                  # messages per minute per visitor
      - key: CHAT_LIMIT_PER_SESSION
        value: "20"
      - key: DEPLOY_LIMIT_PER_IP
        value: "10"                  # bot deploys per hour per visitor
      - key: MAX_BOTS
        value: "20"
      - key: WORKERS
        value: "1"
      - key: GOOGLE_CLIENT_ID
        sync: false                  # paste your Google OAuth client ID in the Render dashboard
      - key: ADMIN_EMAILS
        sync: false                  # e.g. you@gmail.com: these Google accounts can open /admin

  - type: keyvalue
    name: skymind-redis
    plan: free
    ipAllowList: []                  # no outside connections: only SkyMind can reach it
    maxmemoryPolicy: volatile-lru    # under memory pressure drop expiring chat memory first, never the bots
